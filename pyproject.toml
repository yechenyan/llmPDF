[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-markdown-pipeline"
version = "0.7.0"
description = "Task-oriented Docling and Pi PDF-to-Markdown pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "docling>=2.123,<2.124",
  "pdfplumber>=0.11,<0.12",
  "Pillow>=11,<13",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
review = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "pytest>=9,<10",
]

[project.scripts]
pdf-to-markdown = "pdf_to_markdown.cli:main"
parse-table = "parse_table.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_to_markdown = ["review_static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.8,<1"
